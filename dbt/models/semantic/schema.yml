version: 2

models:
  - name: vw_produccion_mensual
    meta:
      owner: "I2 - Analytics Engineering"
      team: "Oil & Gas TP"
      layer: "semantic"
      sensitivity: "publica"
      consumers: ["Metabase", "BI user"]
    description: "Vista semántica con métricas mensuales de producción."
    columns:
      - name: fecha_mes
        description: "Mes de producción."
        tests:
          - not_null
          - unique
      - name: registros_produccion
        description: "Cantidad de registros de producción del mes."
        tests:
          - not_null

  - name: vw_produccion_por_operadora
    meta:
      owner: "I2 - Analytics Engineering"
      team: "Oil & Gas TP"
      layer: "semantic"
      sensitivity: "publica"
      consumers: ["Metabase", "BI user"]
    description: "Vista semántica con métricas mensuales por operadora."
    columns:
      - name: fecha_mes
        description: "Mes de producción."
        tests:
          - not_null
      - name: operadora_id
        description: "Clave surrogate de la operadora."
        tests:
          - not_null
      - name: registros_produccion
        description: "Cantidad de registros de producción para la operadora y el mes."
        tests:
          - not_null

  - name: vw_frescura_datos
    meta:
      owner: "I2 - Analytics Engineering"
      team: "Oil & Gas TP"
      layer: "semantic"
      sensitivity: "publica"
      consumers: ["Metabase", "BI user", "Data engineer"]
    description: "Vista semántica para revisar frescura y cobertura general de datos."
    columns:
      - name: ultima_ingesta
        description: "Último timestamp de ingesta disponible en la fact table."
        tests:
          - not_null
      - name: registros_totales
        description: "Cantidad total de registros en la fact table."
        tests:
          - not_null

  - name: vw_produccion_por_area
    meta:
      owner: "I2 - Analytics Engineering"
      team: "Oil & Gas TP"
      layer: "semantic"
      sensitivity: "publica"
      consumers: ["Metabase", "BI user"]
    description: "Vista semántica con métricas mensuales por área y yacimiento."
    columns:
      - name: fecha_mes
        description: "Mes de producción."
        tests:
          - not_null
      - name: area_id
        description: "Clave surrogate del área."
        tests:
          - not_null
      - name: registros_produccion
        description: "Cantidad de registros de producción para el área y el mes."
        tests:
          - not_null
