services:
  postgres:
    image: postgres:16-alpine
    container_name: warehouse-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-dwh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwh}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dwh} -d ${POSTGRES_DB:-warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mlflow:
    build: ./mlflow
    container_name: mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow/data
      - mlflow-artifacts:/mlflow/artifacts
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dagster:
    build: ./dagster
    container_name: dagster
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-dwh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwh}
      PRODUCCION_SOURCE_URL: ${PRODUCCION_SOURCE_URL:-http://datos.energia.gob.ar/dataset/c846e79c-026c-4040-897f-1ad3543b407c/resource/b5b58cdc-9e07-41f9-b392-fb9ec68b0725/download/produccin-de-pozos-de-gas-y-petrleo-no-convencional.csv}
      POZOS_SOURCE_URL: ${POZOS_SOURCE_URL:-http://datos.energia.gob.ar/dataset/c846e79c-026c-4040-897f-1ad3543b407c/resource/cbfa4d79-ffb3-4096-bab5-eb0dde9a8385/download/listado-de-pozos-cargados-por-empresas-operadoras.csv}
      DATA_PIPELINE_RETRIES: ${DATA_PIPELINE_RETRIES:-3}
      DATA_PIPELINE_RETRY_BACKOFF_SECONDS: ${DATA_PIPELINE_RETRY_BACKOFF_SECONDS:-30}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-oilgas_forecaster}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion}
    volumes:
      - ./extract:/workspace/extract:ro
      - ./dbt:/workspace/dbt:ro
      - ./quality:/workspace/quality:ro
      - ./dagster/dwh_pipeline:/workspace/dwh_pipeline:ro
      - ./ml:/workspace/ml:ro
      - ./feature_store:/workspace/feature_store:ro
      - ./ml_artifacts:/workspace/ml_artifacts
    networks:
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3001:3000"
    environment:
      MB_SITE_NAME: "Oil & Gas Analytics"
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    networks:
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-dwh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwh}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-3}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-oilgas_forecaster}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion}
      ML_ARTIFACTS_DIR: ${ML_ARTIFACTS_DIR:-ml_artifacts}
      LOCAL_MODEL_FALLBACK_PATH: ${LOCAL_MODEL_FALLBACK_PATH:-}
      LOCAL_MODEL_FALLBACK_ENABLED: ${LOCAL_MODEL_FALLBACK_ENABLED:-true}
    volumes:
      - ./ml_artifacts:/app/ml_artifacts:ro
    networks:
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  prometheus:
    build: ./prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      - api

  grafana:
    build: ./grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-pKNF9UsS4mzDtnA}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus

  alertmanager:
    build: ./alertmanager
    ports:
      - "9093:9093"
    env_file:
      - .env
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  grafana-data:
  postgres-data:
  metabase-data:
  mlflow-data:
  mlflow-artifacts:
